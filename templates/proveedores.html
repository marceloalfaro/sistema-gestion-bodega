{% extends "base.html" %}

{% block titulo %}
Proveedores
{% endblock %}

{% block contenido %}

<div class="card">

    <h2>Agregar proveedor</h2>

    <form method="POST">

        <div class="campo">
            <label>Nombre</label>
            <input type="text" name="nombre" required>
        </div>

        <div class="campo">
            <label>Contacto</label>
            <input type="text" name="contacto">
        </div>

        <button type="submit">
            Agregar proveedor
        </button>

    </form>

</div>


<div class="card">

    <h2>Proveedores registrados</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Contacto</th>
        </tr>

        {% for proveedor in proveedores %}

        <tr>
            <td>{{ proveedor.id_proveedor }}</td>
            <td>{{ proveedor.nombre }}</td>
            <td>{{ proveedor.contacto }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
